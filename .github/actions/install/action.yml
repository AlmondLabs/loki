name: install
description: Node 22 to run loki, bun to install, and node_modules restored whole when the dependencies match a saved copy, else bun install.
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "INSTALL_STARTED=$(date +%s)" >> "$GITHUB_ENV"
    # Outside (GitHub Actions): the hosted images already put Node 22 on the path, and setup-node spends 16s on Windows
    # printing npm's and yarn's versions.
    - name: find Node's major version
      id: node
      shell: bash
      run: echo "major=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
    - name: set up Node 22 where the image has none
      if: steps.node.outputs.major != '22'
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22
    - name: set up the bun in package.json's packageManager
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    # Outside (Node): native modules are built for one major version and one system.
    - name: key node_modules on the lockfile, the dependency fields, Node's major and the system
      id: key
      shell: bash
      run: |
        deps=$(node -e 'const p = require("./package.json"); process.stdout.write(JSON.stringify([p.dependencies, p.devDependencies, p.optionalDependencies, p.peerDependencies, p.overrides, p.engines]))')
        sum=$( { printf '%s' "$deps"; cat bun.lock; } | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => process.stdout.write(require("node:crypto").createHash("sha256").update(s).digest("hex")))')
        echo "key=node-modules-${RUNNER_OS}-${RUNNER_ARCH}-node$(node -p 'process.versions.node.split(".")[0]')-${sum}" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.key.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
    - name: save node_modules on a miss
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.key.outputs.key }}
    - name: hold setup to its budget on a cache hit
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: bun run --silent budget --took "$(( $(date +%s) - INSTALL_STARTED ))" install
