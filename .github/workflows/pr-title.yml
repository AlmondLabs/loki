name: pr title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  # Outside (GitHub Actions): the merge queue waits for every required check, and a skipped job passes.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: check the title, passed in the environment so it cannot run as a command
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-pr-title.ts
