name: pr title
# A PR's title becomes its merge commit's message, so it follows Conventional Commits (docs/style.md §9):
# `type(scope): what changed`. scripts/check-pr-title.ts says what is wrong; editing the title reruns this. Every PR,
# docs alone included, since every merge commit is a message.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: pr title
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # The title reaches the script through the environment, never the shell line, where a title could run as a command.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-pr-title.ts
