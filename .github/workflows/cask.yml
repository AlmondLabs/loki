# When a release is published (release.yml leaves a draft; you press publish), read the .dmg's checksum,
# render Casks/loki.rb with scripts/cask.ts and push it to the tap repo <owner>/homebrew-loki, so
# `brew install --cask <owner>/loki/loki` and `brew upgrade` follow the release.
# Needs the TAP_TOKEN secret (a token that can push to homebrew-loki); see docs/RELEASING.md.
name: cask
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cask:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: render the cask from the published dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "loki_${VERSION}_universal.dmg" --dir dist
          SHA="$(sha256sum "dist/loki_${VERSION}_universal.dmg" | cut -d' ' -f1)"
          bun scripts/cask.ts "$OWNER" "$VERSION" "$SHA" > loki.rb
          cat loki.rb
          # The cask rides along on the release too, so anyone can check what the tap will carry.
          gh release upload "$TAG" loki.rb --repo "$GITHUB_REPOSITORY" --clobber
      - name: push it to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is missing — the cask was rendered (see the release assets) but not pushed to ${OWNER}/homebrew-loki. docs/RELEASING.md explains the token."
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-loki.git" tap
          cd tap
          git checkout -B main
          mkdir -p Casks
          cp ../loki.rb Casks/loki.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/loki.rb
          if git diff --cached --quiet; then echo "tap already at ${TAG}"; exit 0; fi
          git commit -m "loki ${TAG#v}"
          git push origin main
