name: shell
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/shell.yml"
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/shell.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  cargo:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            build-essential curl wget file patchelf
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # https://github.com/dtolnay/rust-toolchain/tree/stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Outside (GitHub Actions): a repository's caches share 10 GB, so a branch's own 0.5 GB copies would push
          # main's out and leave the next release build cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: stand-ins for the app build and the bundled resources
        run: |
          mkdir -p app/dist src-tauri/resources
          printf '<!doctype html>' > app/dist/index.html
          touch src-tauri/resources/.placeholder
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
