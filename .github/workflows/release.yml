name: release
on:
  workflow_dispatch:
    inputs:
      kind:
        description: What to ship (only a run on main publishes; a branch only builds)
        type: choice
        options: [nightly, stable]
        default: nightly

permissions: {}

jobs:
  plan:
    name: what this run does
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: set up the bun in package.json's packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_KIND: ${{ inputs.kind }}
        run: bun run release plan

  version:
    name: the version (${{ needs.plan.outputs.kind }})
    needs: plan
    if: needs.plan.outputs.kind == 'stable' || needs.plan.outputs.kind == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind || github.run_id }}
      cancel-in-progress: ${{ needs.plan.outputs.kind == 'nightly' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: set up the bun in package.json's packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: decide the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ needs.plan.outputs.kind }}
        run: |
          set -euo pipefail
          if [ "$KIND" = nightly ]; then
            VERSION="$(bun run --silent release version nightly "$GITHUB_RUN_NUMBER")"
          else
            VERSION="$(bun run --silent release version stable "$GITHUB_SHA")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "this run is $KIND $VERSION"
      - name: draft the stable
        if: needs.plan.outputs.kind == 'stable' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run release draft "$VERSION"
      - name: the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run --silent release notes "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: build macOS (${{ needs.version.outputs.version }})
    needs: [plan, version]
    runs-on: macos-15
    permissions:
      contents: read
    concurrency:
      group: macos-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Outside (GitHub Actions): checkout leaves its token in .git/config, where the install scripts bun runs next
          # could read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: set up the bun in package.json's packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: stamp the version
        run: bun run release set "$VERSION"
      - name: smoke-test the bundle
        run: bun run build:app && bun run build:mod && bun run smoke
      - name: package the app
        run: bun run dist --mac --arm64
      - name: the Mac's update archive, loki.app in a .tar.gz
        run: COPYFILE_DISABLE=1 tar --no-mac-metadata -czf desktop/release/loki.app.tar.gz -C desktop/release/mac-arm64 loki.app
      - name: sign the update file
        env:
          LOKI_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LOKI_UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/sign-update.ts "$VERSION" desktop/release/loki.app.tar.gz
      - name: check the update key
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-update-key.ts --version "$VERSION" desktop/release/loki.app.tar.gz.sig
      - name: smoke-test the packaged app
        run: bun run smoke --electron
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos
          path: |
            desktop/release/loki_*_aarch64.dmg
            desktop/release/loki.app.tar.gz
            desktop/release/loki.app.tar.gz.sig
          if-no-files-found: error

  windows:
    name: build Windows (${{ needs.version.outputs.version }})
    needs: [plan, version]
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: windows-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Outside (GitHub Actions): checkout leaves its token in .git/config, where the install scripts bun runs next
          # could read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: set up the bun in package.json's packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: stamp the version
        run: bun run release set "$VERSION"
      - name: smoke-test the bundle
        run: bun run build:app && bun run build:mod && bun run smoke
      - name: package the app
        run: bun run dist --win --x64
      - name: sign the update file
        env:
          LOKI_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LOKI_UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/sign-update.ts "$VERSION" desktop/release/loki_"$VERSION"_x64-setup.exe
      - name: check the update key
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-update-key.ts --version "$VERSION" desktop/release/loki_"$VERSION"_x64-setup.exe.sig
      - name: smoke-test the packaged app
        run: bun run smoke --electron
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: |
            desktop/release/loki_*_x64-setup.exe
            desktop/release/loki_*_x64-setup.exe.sig
          if-no-files-found: error

  linux:
    name: build Linux (${{ needs.version.outputs.version }})
    needs: [plan, version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: linux-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Outside (GitHub Actions): checkout leaves its token in .git/config, where the install scripts bun runs next
          # could read it.
          persist-credentials: false
      - name: a display for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: set up the bun in package.json's packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: stamp the version
        run: bun run release set "$VERSION"
      - name: smoke-test the bundle
        run: bun run build:app && bun run build:mod && bun run smoke
      - name: package the app
        run: bun run dist --linux --x64
      - name: sign the update file
        env:
          LOKI_UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LOKI_UPDATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/sign-update.ts "$VERSION" desktop/release/loki_"$VERSION"_amd64.AppImage
      - name: check the update key
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-update-key.ts --version "$VERSION" desktop/release/loki_"$VERSION"_amd64.AppImage.sig
      - name: smoke-test the packaged app
        run: xvfb-run -a bun run smoke --electron
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux
          path: |
            desktop/release/loki_*_amd64.AppImage
            desktop/release/loki_*_amd64.AppImage.sig
            desktop/release/loki_*_amd64.deb
          if-no-files-found: error

  publish:
    name: publish (${{ needs.version.outputs.version }})
    needs: [plan, version, macos, windows, linux]
    if: github.ref == 'refs/heads/main' && (needs.plan.outputs.kind == 'stable' || needs.plan.outputs.kind == 'nightly')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: set up the bun in package.json's packageManager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release publish "$KIND" "$VERSION" dist
      - name: render the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "${{ steps.publish.outputs.dmg }}" | cut -d' ' -f1)"
          bun run --silent cask "$OWNER" "$VERSION" "$SHA" "$KIND" > cask.rb
          cat cask.rb
          TAG="$([ "$KIND" = stable ] && echo "v$VERSION" || echo nightly)"
          gh release upload "$TAG" cask.rb --repo "$GITHUB_REPOSITORY" --clobber
      - name: push the cask to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          FILE="$([ "$KIND" = stable ] && echo loki.rb || echo loki-nightly.rb)"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is missing — the cask was rendered (see the release assets) but not pushed to ${OWNER}/homebrew-loki. docs/releasing.md explains the token."
            exit 1
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-loki.git" tap
          cd tap
          git checkout -B main
          mkdir -p Casks
          cp ../cask.rb "Casks/$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$FILE"
          if git diff --cached --quiet; then echo "tap already at $VERSION"; exit 0; fi
          git commit --quiet -m "loki ${KIND} ${VERSION}"
          git push --quiet origin main
      - name: remove the earlier nightlies' files
        if: env.KIND == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release prune-nightly "$VERSION"
