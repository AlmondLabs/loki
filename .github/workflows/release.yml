# Tag a version (`git tag v0.3.0 && git push --tags`) and this builds the macOS app, signs and
# notarizes it when the Apple secrets are present, and attaches the .dmg to a draft release.
# See RELEASING.md for the secrets and the steps around it.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing and notarization: all optional. Without them the .dmg is unsigned (see README, "Requirements").
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "loki ${{ github.ref_name }}"
          releaseBody: "Install with Homebrew: `brew install --cask --no-quarantine ${{ github.repository_owner }}/loki/loki` (the cask follows once this release is published). Or drag the .dmg below to Applications and clear the quarantine flag once, since the app is not signed: `xattr -dr com.apple.quarantine /Applications/loki.app`. First launch installs Letta Code privately, then walks you through a provider and your first agent."
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
