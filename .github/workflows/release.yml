# Releases, two channels, from every push to main (docs/RELEASING.md; scripts/release.ts does the deciding):
#   nightly  every merge builds the app and replaces the rolling `nightly` prerelease and the loki-nightly cask
#   stable   merging the release PR (branch release/next) tags vYYYY.M.D, publishes the release and pushes the loki cask
# The release PR itself is created by the first merge after a stable and rebuilt by every merge after that, and at
# midnight UTC so its number is today's date. Signing is optional (the Apple secrets); TAP_TOKEN pushes the casks.
name: release
on:
  push:
    branches: [main]
  schedule:
    - cron: "5 0 * * *" # refresh the release PR to today's date (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: what this run does
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      next: ${{ steps.plan.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
      - id: plan
        run: bun scripts/release.ts plan

  release-pr:
    name: the release PR
    needs: plan
    if: needs.plan.outputs.kind == 'nightly' || needs.plan.outputs.kind == 'repush'
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # RELEASE_TOKEN (optional, see RELEASING.md) makes the PR's pushes trigger ci.yml; the workflow token cannot.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun scripts/release.ts release-pr "${{ needs.plan.outputs.next }}"

  build:
    name: build and publish (${{ needs.plan.outputs.kind }} ${{ needs.plan.outputs.version }})
    needs: plan
    # a nightly only from a merge (the midnight run and a manual run refresh the PR, they do not ship); a stable always
    if: needs.plan.outputs.kind == 'stable' || (needs.plan.outputs.kind == 'nightly' && github.event_name == 'push')
    runs-on: macos-14
    concurrency:
      # only the newest merge matters for a nightly; a stable is never cancelled
      group: build-${{ needs.plan.outputs.kind }}
      cancel-in-progress: ${{ needs.plan.outputs.kind == 'nightly' }}
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.plan.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # The version files hold the last stable; the build gets this run's number and nothing is committed.
      - name: stamp the version
        run: bun scripts/release.ts set "$VERSION"
      # Signing and notarization are optional, but Tauri signs whenever APPLE_CERTIFICATE is *set*, and a missing
      # secret written straight into `env:` is set to "" — the first release died on "failed to import keychain
      # certificate" that way. So the six variables exist only when the secrets do; without them the .dmg is
      # unsigned (docs/manual.md, "Requirements"; docs/RELEASING.md, "Signing").
      - name: signing secrets, when present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "no Apple certificate secret: the .dmg will be unsigned"; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "signing with $APPLE_SIGNING_IDENTITY"
      - name: build the universal dmg
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target universal-apple-darwin
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/loki_*_universal.dmg)"
          echo "dmg=$DMG" >> "$GITHUB_ENV"
          bun scripts/release.ts publish "$KIND" "$VERSION" "$DMG"
      - name: render the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 "$dmg" | cut -d' ' -f1)"
          bun scripts/cask.ts "$OWNER" "$VERSION" "$SHA" "$KIND" > cask.rb
          cat cask.rb
          # The cask rides along on the release too, so anyone can check what the tap carries.
          TAG="$([ "$KIND" = stable ] && echo "v$VERSION" || echo nightly)"
          gh release upload "$TAG" cask.rb --repo "$GITHUB_REPOSITORY" --clobber
      - name: push the cask to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          FILE="$([ "$KIND" = stable ] && echo loki.rb || echo loki-nightly.rb)"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is missing — the cask was rendered (see the release assets) but not pushed to ${OWNER}/homebrew-loki. docs/RELEASING.md explains the token."
            exit 1
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-loki.git" tap
          cd tap
          git checkout -B main
          mkdir -p Casks
          cp ../cask.rb "Casks/$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$FILE"
          if git diff --cached --quiet; then echo "tap already at $VERSION"; exit 0; fi
          git commit --quiet -m "loki ${KIND} ${VERSION}"
          git push --quiet origin main
