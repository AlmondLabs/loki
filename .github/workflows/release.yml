# Releases, two channels, each shipped when someone asks for it (docs/releasing.md; scripts/release.ts does the
# deciding). Every release is built for the Mac, Windows and Linux in one run, and carries the signed update files loki
# installs from, latest.json, and the unversioned files the install scripts fetch (plan 2026-11-15-2319, U6):
#   stable   merging the release PR (branch release/next) publishes vYYYY.MMDD.N and pushes the loki cask, at once and
#            as often as it is merged
#   nightly  a run by hand on main (Run workflow, or `gh workflow run release.yml --ref main`) builds all three and
#            replaces the rolling `nightly` prerelease and the loki-nightly cask (plan 2026-11-16-1226)
# Any other merge ships nothing and refreshes the release PR. plan says which; the version job decides the number once,
# in a one-at-a-time queue, and drafts a stable at it at once; a build per system makes and signs its files; publish
# writes latest.json, puts everything on the release, renders the cask and prunes the nightly. Only main publishes: a
# run by hand from a branch builds all three and keeps the files as the run's artifacts. The release PR carries no
# version, so nothing goes stale and nothing runs on a schedule. Apple signing is optional (the Apple secrets); the
# update key (TAURI_SIGNING_PRIVATE_KEY) is not, and the builds refuse to make update files without it; TAP_TOKEN
# pushes the casks.
name: release
on:
  push:
    branches: [main]
    # A merge of docs alone starts nothing: the release PR waits for the next change that does.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # No inputs: a run by hand is a nightly, published only when it runs from main.
  workflow_dispatch:

# Nothing by default: each job asks for what it needs, so the builds (third-party actions, the signing secrets) cannot
# write, and the plan cannot write at all.
permissions: {}

jobs:
  plan:
    name: what this run does
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # the published releases say which stables have shipped (a draft, or a bare tag, has not)
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- plan

  # The release PR, refreshed by every merge but its own.
  release-pr:
    name: the release PR
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.kind != 'stable'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          # RELEASE_TOKEN (optional, see releasing.md) makes the PR's pushes trigger ci.yml; the workflow token cannot.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run release -- release-pr

  # The number, decided once from the date, the tags and the drafts, in a queue that runs one at a time. A stable is
  # drafted at its number straight away (no tag until it is published), so a stable queued behind it sees the draft and
  # takes the next number; a re-run of the same merge takes its own draft's number back. Only the newest run matters
  # for a nightly. GitHub keeps one waiting run per queue: of three release merges in a few minutes the middle one may
  # be dropped, and the third, built from a later main, carries its changes. A run by hand from a branch gets a queue
  # of its own, so it never cancels main's nightly.
  version:
    name: the version (${{ needs.plan.outputs.kind }})
    needs: plan
    if: needs.plan.outputs.kind == 'stable' || needs.plan.outputs.kind == 'nightly'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind || github.run_id }}
      cancel-in-progress: ${{ needs.plan.outputs.kind == 'nightly' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # A nightly is numbered by this run, so nightlies rise run by run; its commit goes in the release's title instead.
      - name: decide the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: ${{ needs.plan.outputs.kind }}
        run: |
          set -euo pipefail
          if [ "$KIND" = nightly ]; then
            VERSION="$(npm run --silent release -- version nightly "$GITHUB_RUN_NUMBER")"
          else
            VERSION="$(npm run --silent release -- version stable "$GITHUB_SHA")"
            npm run release -- draft "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "this run is $KIND $VERSION"

  # The builds, one per system, for a stable and a nightly alike, each stamping the queued number on the runner only
  # (main takes changes through PRs alone). Each makes its bundles and its signed update file and hands them to publish
  # as an artifact. A newer nightly of main cancels an older one's builds and publish (cancel-in-progress below), so an
  # older nightly never lands over a newer one; a stable's and a branch run's jobs queue behind nothing.
  # macOS, for Apple silicon only: loki_<version>_aarch64.dmg, and loki.app.tar.gz, its update file.
  macos:
    name: build macOS (${{ needs.version.outputs.version }})
    needs: [plan, version]
    runs-on: macos-15
    permissions:
      contents: read
    concurrency:
      group: macos-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # npm ci runs every dependency's install script next: none of them finds a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Only main saves: a branch reads main's cache, and its own 0.5 GB copies would push main's out of the
          # repository's 10 GB, leaving the next release build cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: stamp the version
        run: npm run release -- set "$VERSION"
      # The bundle this build ships, started and asked what the app asks (scripts/smoke.ts): a broken one stops here,
      # before anything is published.
      - name: smoke-test the bundle
        run: npm run build:mod && npm run smoke
      # Signing and notarization are optional, but Tauri signs whenever APPLE_CERTIFICATE is *set*, and a missing
      # secret written straight into `env:` is set to "" — the first release died on "failed to import keychain
      # certificate" that way. So the six variables exist only when the secrets do; without them the .dmg is
      # unsigned (docs/manual.md, "Requirements"; docs/releasing.md, "Signing").
      - name: signing secrets, when present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "no Apple certificate secret: the .dmg will be unsigned"; exit 0; fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "signing with $APPLE_SIGNING_IDENTITY"
      # The update key signs the updater archive every loki installs from (plan 2026-11-15-2319, U4); the bundler
      # refuses to build it without the key. This step's env alone, so no later step sees it.
      - name: build the Apple silicon dmg and update archive
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin
      # The build was the last step that signs: the steps after it get no Apple secret.
      - name: drop the signing secrets
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$v=" >> "$GITHUB_ENV"
          done
      # tauri-cli only warns when the key that signed is not tauri.conf.json's pubkey's pair, and a loki built that way
      # could never verify an update: stop before anything ships (docs/releasing.md, "The update key").
      - name: check the update key
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-update-key.ts $(find src-tauri/target -path '*/bundle/*' -name '*.sig')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/loki_*_aarch64.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/loki.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/loki.app.tar.gz.sig
          if-no-files-found: error

  # Windows: the NSIS installer, loki_<version>_x64-setup.exe, which is also its update file.
  windows:
    name: build Windows (${{ needs.version.outputs.version }})
    needs: [plan, version]
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: windows-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # npm ci runs every dependency's install script next: none of them finds a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Only main saves: a branch reads main's cache, and its own 0.5 GB copies would push main's out of the
          # repository's 10 GB, leaving the next release build cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: stamp the version
        run: npm run release -- set "$VERSION"
      # The bundle this build ships, started and asked what the app asks (scripts/smoke.ts): a broken one stops here,
      # before anything is published.
      - name: smoke-test the bundle
        run: npm run build:mod && npm run smoke
      - name: build the installer
        run: npm run tauri -- build --bundles nsis
        # createUpdaterArtifacts is on, so the bundler signs the update file and refuses to build without the key.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # tauri-cli only warns when the key that signed is not tauri.conf.json's pubkey's pair, and a loki built that way
      # could never verify an update: stop before anything ships (docs/releasing.md, "The update key").
      - name: check the update key
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-update-key.ts $(find src-tauri/target -path '*/bundle/*' -name '*.sig')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/loki_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/loki_*_x64-setup.exe.sig
          if-no-files-found: error

  # Linux: loki_<version>_amd64.AppImage, which is also its update file, and loki_<version>_amd64.deb, built on the
  # oldest supported Ubuntu so they run on newer glibc too. The apt list is shell.yml's: the 22.04 names, no
  # appindicator (the tray is Mac-only).
  linux:
    name: build Linux (${{ needs.version.outputs.version }})
    needs: [plan, version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: linux-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # npm ci runs every dependency's install script next: none of them finds a token in .git/config.
          persist-credentials: false
      - name: linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            build-essential curl wget file patchelf
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Only main saves: a branch reads main's cache, and its own 0.5 GB copies would push main's out of the
          # repository's 10 GB, leaving the next release build cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: stamp the version
        run: npm run release -- set "$VERSION"
      # The bundle this build ships, started and asked what the app asks (scripts/smoke.ts): a broken one stops here,
      # before anything is published.
      - name: smoke-test the bundle
        run: npm run build:mod && npm run smoke
      - name: build the AppImage and .deb
        run: npm run tauri -- build --bundles appimage,deb --verbose
        # createUpdaterArtifacts is on, so the bundler signs the update file and refuses to build without the key.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # tauri-cli only warns when the key that signed is not tauri.conf.json's pubkey's pair, and a loki built that way
      # could never verify an update: stop before anything ships (docs/releasing.md, "The update key").
      - name: check the update key
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/check-update-key.ts $(find src-tauri/target -path '*/bundle/*' -name '*.sig')
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/loki_*_amd64.AppImage
            src-tauri/target/release/bundle/appimage/loki_*_amd64.AppImage.sig
            src-tauri/target/release/bundle/deb/loki_*_amd64.deb
          if-no-files-found: error

  # Everything goes out together or not at all: publish runs only when all three builds did, and only on main, for a
  # stable from a merge or a nightly from a run by hand, so a run from a branch never touches a release or the
  # `nightly` tag. Each step is safe to run again: a re-run finishes what the last run left (plan 096).
  publish:
    name: publish (${{ needs.version.outputs.version }})
    needs: [plan, version, macos, windows, linux]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' && needs.plan.outputs.kind == 'stable' || github.event_name == 'workflow_dispatch' && needs.plan.outputs.kind == 'nightly')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' && 'nightly' || github.run_id }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.kind == 'nightly' }}
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      VERSION: ${{ needs.version.outputs.version }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      # latest.json from the builds' .sig files, the versioned files, then latest.json and the install scripts'
      # unversioned copies (scripts/release.ts publish). A missing signature fails here, naming the platform, before
      # anything is uploaded. It answers the .dmg the cask is made from: this build's, or the one a stable already went
      # out with, since a rebuild is not the same file.
      - name: publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- publish "$KIND" "$VERSION" dist
      - name: render the cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(sha256sum "${{ steps.publish.outputs.dmg }}" | cut -d' ' -f1)"
          npm run --silent cask -- "$OWNER" "$VERSION" "$SHA" "$KIND" > cask.rb
          cat cask.rb
          # The cask rides along on the release too, so anyone can check what the tap carries.
          TAG="$([ "$KIND" = stable ] && echo "v$VERSION" || echo nightly)"
          gh release upload "$TAG" cask.rb --repo "$GITHUB_REPOSITORY" --clobber
      # The nightly cask is deprecated but still pushed: one last brew upgrade brings its people a self-updating loki.
      - name: push the cask to the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          FILE="$([ "$KIND" = stable ] && echo loki.rb || echo loki-nightly.rb)"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is missing — the cask was rendered (see the release assets) but not pushed to ${OWNER}/homebrew-loki. docs/releasing.md explains the token."
            exit 1
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/${OWNER}/homebrew-loki.git" tap
          cd tap
          git checkout -B main
          mkdir -p Casks
          cp ../cask.rb "Casks/$FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$FILE"
          if git diff --cached --quiet; then echo "tap already at $VERSION"; exit 0; fi
          git commit --quiet -m "loki ${KIND} ${VERSION}"
          git push --quiet origin main
      # Only now that latest.json and the tap name this nightly's files are the earlier ones taken off the release:
      # every file carrying another version, never latest.json or the unversioned copies.
      - name: remove the earlier nightlies' files
        if: env.KIND == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- prune-nightly "$VERSION"
