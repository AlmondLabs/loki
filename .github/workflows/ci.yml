name: ci
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # The queue runs everything before a PR reaches main; a PR's own run narrows the suite to what its diff reaches.
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Side by side, not one after another: the run takes as long as its slowest check.
  typecheck:
    name: types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/install
      - run: npm run typecheck

  format:
    name: format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/install
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/install
      - run: npm run lint

  test:
    name: tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: install
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ${{ github.event_name == 'pull_request' && 'npm run test:pr' || 'npm test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:node

  build:
    name: bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: install
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:app
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:site
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: npm run smoke

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: install
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ${{ github.event_name == 'pull_request' && 'npm run test:pr' || 'npm test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:node
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: npm run smoke
