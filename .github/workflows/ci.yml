name: ci
# The checks a PR must pass, on the PR only: GitHub tests its merge with main (refs/pull/N/merge), so the merge itself
# is not tested again; release.yml's nightly build compiles every merge. A newer push to the PR cancels the run before
# it. Docs and the two release PRs' marker files change nothing these check, so a PR touching only them starts nothing
# (skills/loki/SKILL.md ships in the app and is not skipped). The Rust shell's tests are shell.yml, run when it changes.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/release.txt"
      - ".github/preview.txt"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# bash on every system, Windows included (Git Bash on the hosted runner), so a step reads the same on all three.
defaults:
  run:
    shell: bash

jobs:
  # What does not depend on the system, once: types, lint, the whole suite, the Node runner's tests, both builds.
  checks:
    name: types, lint, tests and bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Everything runs on Node: the tests, the scripts and loki's daemon (22.19 or newer: node:sqlite, type stripping).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      # Each check runs once the install did, whatever the one before it said: a lint error must not hide a failing
      # test (it did, from 2026-10-09: Windows' tests went unrun behind lint).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      # Node's own test runner, for the tests that need it: a crash and resume, the mod folder's reloads (test-node/).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:node
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:app
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:mod

  # The suite on the Mac and Windows: paths, shells, processes and signals differ there (plan 014). fail-fast off: one
  # system's failure must not hide the other's.
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:node
