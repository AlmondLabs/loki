name: ci
on:
  push:
    branches: [main]
  pull_request:

# Every job runs on the Mac, Windows and Linux (plan 014 U9, R13). fail-fast off: one system's failure must not hide
# another's. bash on every system, Windows included (Git Bash on the hosted runner), so a step reads the same on all three.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: tests, types, daemon and mod bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      # loki's daemon runs on Node (22.19 or newer: node:sqlite, type stripping), and some of its tests only can: a
      # crash and resume, the mod folder's reloads (test-node/).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run test:node
      - run: bun run build:app
      - run: bun run build:mod

  shell:
    name: tauri shell, cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Tauri 2's Linux build prerequisites, the Ubuntu 22.04 names (KTD11). No appindicator library: the tray is
      # Mac-only (KTD3). patchelf is for the AppImage bundler, kept so this list matches the release leg's.
      - name: linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            build-essential curl wget file patchelf
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # tauri::generate_context!() needs frontendDist (app/dist) to exist at compile time; build:mod then ships it for phones.
      - run: bun run build:app
      - run: bun run build:mod
      - run: cargo test --manifest-path src-tauri/Cargo.toml
