name: ci
on:
  # Outside (GitHub Actions): a required check that never reports holds the PR, so a docs-only PR runs every job too.
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run typecheck

  format:
    name: format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run format:check

  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - name: find whether the PR's diff reaches every file's lint
        id: lint-plan
        if: ${{ github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: bun run --silent lint:pr --plan >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && steps.lint-plan.outputs.all != 'true' && 'bun run lint:pr' || 'bun run lint' }}

  test:
    name: tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && 'bun run test:pr' || 'bun run test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run test:node

  build:
    name: bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(site/|app/src/kit/|package\.json$|bun\.lock$|tsconfig)'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:app
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name != 'pull_request' || steps.scope.outputs.site_changed != 'false') }}
        run: bun run --silent budget bun run build:site
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run smoke

  desktop:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:mod
      - id: package
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run dist --dir
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.package.outcome == 'success' && runner.os != 'Linux' }}
        run: bun run --silent budget bun run smoke --electron
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.package.outcome == 'success' && runner.os == 'Linux' }}
        run: bun run --silent budget xvfb-run -a bun run smoke --electron

  # Outside (Windows): it starts processes several times slower than Linux, and the suite's git and daemon tests start
  # many.
  windows:
    name: tests (windows-latest, ${{ matrix.shard }}/3)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - name: find whether the PR changes only docs
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && 'bun run test:pr' || 'bun run test' }} --shard=${{ matrix.shard }}/3
      - if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.shard == 2 }}
        run: bun run --silent budget bun run test:node
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.shard == 1 }}
        run: bun run --silent budget bun run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run smoke

  windows-result:
    name: tests (windows-latest)
    needs: windows
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - run: test "${{ needs.windows.result }}" = success

  # Outside (GitHub Actions): Mac runners can queue for minutes, and a skipped job counts as passed.
  mac-scope:
    name: mac scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - id: scope
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/mac-scope.ts >> "$GITHUB_OUTPUT"

  mac:
    name: tests (macos-15)
    needs: mac-scope
    if: ${{ !cancelled() && needs.mac-scope.outputs.needed != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: install
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && 'bun run test:pr' || 'bun run test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run test:node
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run smoke
