name: ci
on:
  # Every PR, docs alone included: the checks are required, so each job reports. On a PR that changes only docs, each
  # job passes after its checkout (the scope step) without installing or checking anything.
  pull_request:
  # The queue runs everything before a PR reaches main; a PR's own run narrows the suite to what its diff reaches.
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Side by side, not one after another: the run takes as long as its slowest check.
  typecheck:
    name: types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run typecheck

  format:
    name: format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run format:check

  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      # On a PR, the files the diff reaches (scripts/lint-pr.ts); a change to the lint's setup lints everything, under
      # the whole lint's budget. The merge queue always lints everything.
      - id: lint-plan
        if: ${{ github.event_name == 'pull_request' && steps.install.outcome == 'success' }}
        run: bun run --silent lint:pr --plan >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && steps.lint-plan.outputs.all != 'true' && 'bun run lint:pr' || 'bun run lint' }}

  test:
    name: tests (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && 'bun run test:pr' || 'bun run test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run test:node

  build:
    name: bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:app
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:site
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run smoke

  windows:
    name: tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qvE '^(docs/|LICENSE$|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - id: install
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && 'bun run test:pr' || 'bun run test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run test:node
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run smoke

  # GitHub's Mac runners can queue for minutes, so a PR waits for one only when its diff can reach what runs
  # differently on macOS (scripts/mac-scope.ts). A skipped job counts as passed; the queue and main run it always.
  mac-scope:
    name: mac scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - id: scope
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/mac-scope.ts >> "$GITHUB_OUTPUT"

  mac:
    name: tests (macos-15)
    needs: mac-scope
    # Runs unless the scope said no: a scope that failed or never ran (the queue, main) leaves the Mac job on.
    if: ${{ !cancelled() && needs.mac-scope.outputs.needed != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          filter: blob:none
      - id: install
        uses: ./.github/actions/install
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget ${{ github.event_name == 'pull_request' && 'bun run test:pr' || 'bun run test' }}
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run test:node
      - id: bundle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run --silent budget bun run build:mod
      - if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: bun run --silent budget bun run smoke
