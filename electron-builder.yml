appId: app.loki.desktop
productName: loki
directories:
  app: desktop/dist
  output: desktop/release
  buildResources: desktop/build
files:
  - "**/*"
  - "!**/*.map"
extraResources:
  - from: desktop/resources
    to: resources
  - from: desktop/assets
    to: assets
  - from: desktop/build/icon.png
    to: assets/icon.png
npmRebuild: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: false
  grantFileProtocolExtraPrivileges: false
  onlyLoadAppFromAsar: true
mac:
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  identity: "-"
  hardenedRuntime: false
  minimumSystemVersion: "13.3"
  icon: desktop/build/icon.icns
  category: public.app-category.productivity
  extendInfo:
    NSAppSleepDisabled: true
dmg:
  artifactName: loki_${version}_aarch64.dmg
win:
  target:
    - target: nsis
      arch: x64
  icon: desktop/build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  artifactName: loki_${version}_x64-setup.exe
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  icon: desktop/build/icon.png
  category: Utility
  artifactName: loki_${version}_amd64.${ext}
deb:
  afterInstall: desktop/linux/after-install.sh
publish: null
