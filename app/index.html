<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page run under the notch (env(safe-area-inset-*) in the phone shell);
         maximum-scale=1 stops iOS zooming into a focused text box (pinch zoom stays available). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>loki</title>
    <meta name="theme-color" content="#1c1c1e" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the saved preference before CSS or React paints. The provider repeats this logic after
      // mount so system mode follows later OS changes and the theme-color meta stays in sync.
      (function () {
        // --loki-bg, night and day, repeated from kit/tokens.css (test/tokens.test.ts keeps them equal).
        var grounds = { dark: "#1c1c1e", light: "#ffffff" };
        var preference = "system";
        try {
          var saved = localStorage.getItem("loki.theme");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
        } catch (_) {}
        var theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        // Linux starts Liquid Glass on its solid look-alike (theme.tsx GLASS_ON), before any stylesheet paints.
        if (/Linux|X11|CrOS/.test(navigator.userAgent) && navigator.userAgent.indexOf("like Mac OS X") < 0) document.documentElement.dataset.glass = "solid";
        // The Mac app's window has the sidebar material behind the page (theme.tsx VIBRANT), so Liquid Glass starts clear.
        if (window.__TAURI_INTERNALS__ && /Mac/.test(navigator.userAgent) && !/like Mac OS X/.test(navigator.userAgent)) document.documentElement.dataset.vibrant = "on";
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = grounds[theme];
      })();
    </script>
    <!-- Added to the Home Screen on iOS: no browser chrome. The status bar keeps its own strip, painted by iOS in
         the theme-color above (dark or light with the theme): with the translucent style WebKit draws the view from
         the top edge but sizes it as if it began below the bar, and the bar's height turns up as a gap under the
         tab bar. iOS reads this tag when the icon is added, so a change needs the icon added again. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="loki" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <!-- The page's own colour before any stylesheet arrives (a home-screen app shows this while the script
         loads), and a fallback for when it never does: a stale cached page, a Mac that did not answer. -->
    <style>
      html { background: #1c1c1e; color: #f5f5f7; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
      html[data-theme="light"] { background: #ffffff; color: #1d1d1f; }
      html[data-vibrant] { background: transparent; }
      body { margin: 0; }
      #loki-fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #loki-fallback[hidden] { display: none; }
      #loki-fallback p { margin: 0 0 8px; max-width: 30em; }
      #loki-fallback .muted { color: #aeaeb2; }
      html[data-theme="light"] #loki-fallback .muted { color: #636366; }
      #loki-fallback button { margin-top: 14px; padding: 12px 22px; font: inherit; color: #3d9bff; background: transparent; border: 1px solid #3d9bff; border-radius: 999px; }
      html[data-theme="light"] #loki-fallback button { color: #0064d6; border-color: #0064d6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loki-fallback" hidden>
      <div>
        <p>loki did not load.</p>
        <p class="muted">Same Wi‑Fi as the Mac, or Tailscale switched on, and loki open on the Mac.</p>
        <button type="button" onclick="location.reload()">Try Again</button>
      </div>
    </div>
    <script>
      // Shown only if nothing has rendered after eight seconds: the app's first paint is well under one. A slow
      // link can still bring the app in later; the notice then goes, so it never sits over a working page.
      setTimeout(function () {
        var root = document.getElementById("root");
        var fallback = document.getElementById("loki-fallback");
        if (!root || root.firstChild) return;
        fallback.hidden = false;
        new MutationObserver(function (_, seen) {
          if (!root.firstChild) return;
          fallback.hidden = true;
          seen.disconnect();
        }).observe(root, { childList: true });
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
