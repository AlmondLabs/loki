<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page run under the notch (env(safe-area-inset-*) in the phone shell);
         maximum-scale=1 stops iOS zooming into a focused text box (pinch zoom stays available). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>loki</title>
    <meta name="theme-color" content="#0e1217" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the saved preference before CSS or React paints. The provider repeats this logic after
      // mount so system mode follows later OS changes and the theme-color meta stays in sync.
      (function () {
        // Each family's --loki-bg, night and day, repeated from kit/tokens.css (test/tokens.test.ts keeps them equal).
        var grounds = { "loki": { dark: "#0e1217", light: "#e8eced" }, "tokyo-night": { dark: "#1a1b26", light: "#e1e2e7" } };
        var preference = "system";
        var palette = "loki";
        try {
          var saved = localStorage.getItem("loki.theme");
          if (saved === "light" || saved === "dark" || saved === "system") preference = saved;
          var family = localStorage.getItem("loki.palette");
          if (family && grounds[family]) palette = family;
        } catch (_) {}
        var theme = preference === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.palette = palette;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = grounds[palette][theme];
      })();
    </script>
    <!-- Added to the Home Screen on iOS: no browser chrome. The status bar keeps its own strip, painted by iOS in
         the theme-color above (dark or light with the theme): with the translucent style WebKit draws the view from
         the top edge but sizes it as if it began below the bar, and the bar's height turns up as a gap under the
         tab bar. iOS reads this tag when the icon is added, so a change needs the icon added again. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="loki" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <!-- The page's own colour before any stylesheet arrives (a home-screen app shows this while the script
         loads), and a fallback for when it never does: a stale cached page, a Mac that did not answer. -->
    <style>
      html { background: #0e1217; color: #e8e4dc; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
      html[data-theme="light"] { background: #e8eced; color: #1c222a; }
      html[data-palette="tokyo-night"] { background: #1a1b26; color: #c0caf5; }
      html[data-palette="tokyo-night"][data-theme="light"] { background: #e1e2e7; color: #343b59; }
      body { margin: 0; }
      #loki-fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #loki-fallback[hidden] { display: none; }
      #loki-fallback p { margin: 0 0 8px; max-width: 30em; }
      #loki-fallback .muted { color: #9299a2; }
      html[data-theme="light"] #loki-fallback .muted { color: #565f68; }
      #loki-fallback button { margin-top: 14px; padding: 12px 22px; font: inherit; color: #d3a64f; background: transparent; border: 1px solid #d3a64f; border-radius: 999px; }
      html[data-theme="light"] #loki-fallback button { color: #745922; border-color: #745922; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loki-fallback" hidden>
      <div>
        <p>loki did not load.</p>
        <p class="muted">Same Wi‑Fi as the Mac, or Tailscale switched on, and loki open on the Mac.</p>
        <button type="button" onclick="location.reload()">try again</button>
      </div>
    </div>
    <script>
      // Shown only if nothing has rendered after eight seconds: the app's first paint is well under one.
      setTimeout(function () {
        var root = document.getElementById("root");
        if (root && !root.firstChild) document.getElementById("loki-fallback").hidden = false;
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
